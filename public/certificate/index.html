/* ---------- Tokens ---------- */
:root{
  --cream:#FAF8F3; --green:#1D9E75; --green-d:#0F6E56; --forest:#0B3D2E; --gold:#BA7517;
  --ink:#1c2a24; --muted:#5d6b64; --line:#e3ddcf; --err:#a8321f; --ok:#0F6E56;
  --shadow:0 10px 30px rgba(11,61,46,.10), 0 2px 6px rgba(11,61,46,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(900px 500px at 85% -10%, rgba(29,158,117,.10), transparent 60%),
  radial-gradient(700px 420px at -10% 105%, rgba(186,117,23,.10), transparent 60%), var(--cream)}

.app{width:100%;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
.hero{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0 18px}
.hello{margin:0 0 6px;font-weight:700;font-size:clamp(1.35rem,5.6vw,1.7rem);color:var(--forest)}
.lead{margin:0;font-size:clamp(1.05rem,4.4vw,1.25rem);color:var(--muted);font-weight:600}
.headline{margin:2px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(2.3rem,10.5vw,3.1rem);line-height:1.02;color:var(--green-d);letter-spacing:-.01em}
.badge{width:clamp(130px,38vw,170px);height:auto;margin-top:18px;filter:drop-shadow(0 8px 14px rgba(186,117,23,.28))}

.card{margin-top:auto;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px 18px 18px}
.card h2{margin:0 0 12px;font-size:1.12rem;font-weight:700;color:var(--forest)}
label{display:block;margin:12px 0 6px;font-weight:600;font-size:1rem;color:var(--forest)}
input{width:100%;height:56px;border:2px solid var(--line);border-radius:16px;padding:0 16px;font:inherit;font-size:1.125rem;color:var(--ink);background:var(--cream);outline:none;transition:border-color .15s, box-shadow .15s}
input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(29,158,117,.16);background:#fff}
input[aria-invalid="true"]{border-color:var(--err)}
.phone-wrap{position:relative}
.phone-wrap .state{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:none}
.phone-wrap.checking .state, .phone-wrap.ok .state{display:block}
.phone-wrap input{padding-right:48px}
.spin{width:22px;height:22px;border:3px solid rgba(15,110,86,.25);border-top-color:var(--green-d);border-radius:50%;animation:rot .8s linear infinite}
.phone-wrap.ok .spin{display:none}
.tick{display:none;width:24px;height:24px;color:var(--green)}
.phone-wrap.ok .tick{display:block}
@keyframes rot{to{transform:rotate(360deg)}}
.msg{min-height:1.4em;margin:8px 2px 0;font-size:.95rem;font-weight:600}
.msg.err{color:var(--err)} .msg.ok{color:var(--ok)} .msg.info{color:var(--muted)}
.msg a{color:var(--green-d);word-break:break-all}
.msg a.join{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:12px;padding:0 20px;border-radius:16px;background:linear-gradient(180deg,#1D9E75,#0F6E56);color:#fff;font-size:1.05rem;font-weight:700;text-decoration:none;word-break:normal;box-shadow:0 6px 14px rgba(15,110,86,.25)}
.msg a.join:active{transform:translateY(1px)}
.msg a.join:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.msg button.link{background:none;border:0;padding:0;margin-left:6px;font:inherit;font-weight:700;color:var(--green-d);text-decoration:underline;cursor:pointer}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:14px;border:0;border-radius:18px;font:inherit;font-size:1.15rem;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--green),var(--green-d));box-shadow:0 8px 18px rgba(15,110,86,.28);cursor:pointer;transition:transform .08s, box-shadow .15s, filter .15s}
.btn:active:not(:disabled){transform:translateY(1px) scale(.995)}
.btn:disabled{background:#cfd4d1;color:#f5f7f6;box-shadow:none;cursor:not-allowed}
.btn .spin{border-color:rgba(255,255,255,.4);border-top-color:#fff}
.btn:focus-visible,.link:focus-visible,.cert-img:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Result */
.result{display:none;flex-direction:column;align-items:center;padding-top:6px;flex:1}
.cert-img{width:100%;max-width:440px;height:auto;aspect-ratio:1122/1402;border-radius:14px;box-shadow:var(--shadow);background:#fff;cursor:zoom-in;display:block}
.result .btn{max-width:440px}
.note{max-width:440px;margin:12px 4px 0;font-size:.95rem;color:var(--muted);text-align:center}
.note strong{color:var(--forest)}
.again{margin-top:14px;background:none;border:0;font:inherit;font-weight:600;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
body.done .hero, body.done .card{display:none}
body.done .result{display:flex}

.lightbox{position:fixed;inset:0;z-index:50;background:rgba(11,61,46,.92);display:none;align-items:center;justify-content:center;padding:12px;touch-action:pinch-zoom}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

@media (min-width:900px){
  .app{min-height:0;margin:5vh auto;max-width:520px}
  .hero{flex:0 0 auto;padding-bottom:26px}
  .card{margin-top:0}
}
@media (max-height:640px){ .badge{width:96px;margin-top:10px} .hero{padding-bottom:8px} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

var INDIC_FAMILIES = [];   // single-file build: Indian-script names use the phone's own fonts

/* =============================== Helpers =============================== */
var $ = function (id) { return document.getElementById(id); };
var nameEl = $('name'), phoneEl = $('phone'), phoneWrap = $('phoneWrap'), phoneMsg = $('phoneMsg'), submitBtn = $('submit');

/** Same rules as the backend: strip non-digits, accept 91 / +91 / 0 prefixes, 10 digits starting 6-9. */
function normaliseMobile(input) {
  var d = String(input == null ? '' : input).replace(/\D/g, '');
  if (d.length === 12 && d.indexOf('91') === 0) d = d.slice(2);
  else if (d.length === 11 && d.charAt(0) === '0') d = d.slice(1);
  else if (d.length === 13 && d.indexOf('091') === 0) d = d.slice(3);
  return /^[6-9]\d{9}$/.test(d) ? d : null;
}
function digitCount(input) { return String(input || '').replace(/\D/g, '').length; }

function cleanName(input) {
  return String(input == null ? '' : input)
    .replace(/[\u0000-\u001F\u007F-\u009F\u200B\u2028\u2029\uFEFF]/g, ' ')
    .replace(/\s+/g, ' ').trim().slice(0, 80).trim();
}
function nameValid(n) { return n.length > 0 && /\p{L}/u.test(n); }

function setMsg(kind, nodeOrText) {
  phoneMsg.className = 'msg ' + (kind || '');
  phoneMsg.textContent = '';
  if (nodeOrText == null) return;
  if (typeof nodeOrText === 'string') phoneMsg.textContent = nodeOrText;
  else phoneMsg.appendChild(nodeOrText);
}
function notFoundNode() {
  var f = document.createDocumentFragment();
  f.appendChild(document.createTextNode("You haven't attended the session yet. Join the Ojusvi WhatsApp Community for all the schedule details!"));
  var a = document.createElement('a');
  a.className = 'join'; a.href = WHATSAPP_COMMUNITY; a.target = '_blank'; a.rel = 'noopener noreferrer';
  a.textContent = 'Join Ojusvi Community';
  f.appendChild(a);
  return f;
}
function retryNode(text, fn) {
  var f = document.createDocumentFragment();
  f.appendChild(document.createTextNode(text));
  var b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = 'Retry';
  b.addEventListener('click', fn); f.appendChild(b);
  return f;
}

/* =============================== API =============================== */
function api(payload) {
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) {
    return Promise.resolve({ ok: false, code: 'CONFIG', message: 'This page is not connected to the server yet.' });
  }
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, REQUEST_TIMEOUT_MS);
  return fetch(API_URL, {
    method: 'POST',
    // text/plain avoids a CORS preflight, which Apps Script cannot answer.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow',
    signal: ctl.signal
  }).then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(t); return j && typeof j === 'object' ? j : { ok: false, code: 'SERVER_ERROR', message: 'Unexpected server response.' }; })
    .catch(function () {
      clearTimeout(t);
      return { ok: false, code: 'NETWORK', message: 'Network problem. Please check your connection.' };
    });
}

/* =============================== Phone verification =============================== */
var verified = null;          // normalised number confirmed in the sheet
var checking = false;
var reqSeq = 0;
var cache = Object.create(null);   // normalised -> 'ok' | 'notfound'
var timer = null;
var busy = false;

function updateButton() {
  var n = normaliseMobile(phoneEl.value);
  var ready = !busy && nameValid(cleanName(nameEl.value)) && n && verified === n;
  submitBtn.disabled = !ready;
}

function onPhoneInput() {
  clearTimeout(timer);
  var raw = phoneEl.value;
  var n = normaliseMobile(raw);
  phoneEl.setAttribute('aria-invalid', 'false');
  phoneWrap.classList.remove('checking', 'ok');

  if (!n) {
    verified = null; checking = false; reqSeq++;
    if (digitCount(raw) >= 10) {
      phoneEl.setAttribute('aria-invalid', 'true');
      setMsg('err', 'Please enter a valid 10-digit Indian mobile number.');
    } else setMsg('', null);
    updateButton(); return;
  }
  if (cache[n] === 'ok') { verified = n; phoneWrap.classList.add('ok'); setMsg('ok', 'Number verified ✓'); updateButton(); return; }
  if (cache[n] === 'notfound') { verified = null; setMsg('err', notFoundNode()); updateButton(); return; }

  verified = null; updateButton();
  setMsg('info', 'Checking…'); phoneWrap.classList.add('checking');
  timer = setTimeout(function () { runCheck(n); }, DEBOUNCE_MS);
}

function runCheck(n) {
  var id = ++reqSeq; checking = true;
  phoneWrap.classList.add('checking'); setMsg('info', 'Checking…');
  api({ action: 'check', mobile: n }).then(function (res) {
    if (id !== reqSeq) return;               // a newer keystroke superseded this request
    checking = false; phoneWrap.classList.remove('checking');
    if (res.ok && res.eligible) {
      cache[n] = 'ok'; verified = n; phoneWrap.classList.add('ok'); setMsg('ok', 'Number verified ✓');
    } else if (res.code === 'NOT_FOUND') {
      cache[n] = 'notfound'; verified = null; setMsg('err', notFoundNode());
    } else if (res.code === 'NETWORK' || res.code === 'BUSY' || res.code === 'SERVER_ERROR') {
      verified = null; setMsg('err', retryNode((res.message || 'Could not verify your number.') + ' ', function () { runCheck(n); }));
    } else {
      verified = null; setMsg('err', res.message || 'Could not verify your number.');
    }
    updateButton();
  });
}

phoneEl.addEventListener('input', onPhoneInput);
nameEl.addEventListener('input', updateButton);
[nameEl, phoneEl].forEach(function (el) {
  // Keep the focused field visible above the mobile keyboard.
  el.addEventListener('focus', function () { setTimeout(function () { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 300); });
});

/* =============================== Certificate rendering =============================== */
var bgPromise = null;
function loadBg() {
  if (!bgPromise) {
    bgPromise = new Promise(function (resolve, reject) {
      var im = new Image();
      im.onload = function () { (im.decode ? im.decode().catch(function () {}) : Promise.resolve()).then(function () { resolve(im); }); };
      im.onerror = function () { bgPromise = null; reject(new Error('Background image failed to load')); };
      im.src = CERT.BG;
    });
  }
  return bgPromise;
}

function ensureFonts(name, dateStr) {
  var jobs = [
    document.fonts.load('700 40px Poppins', name + dateStr),
    document.fonts.load('500 30px Poppins', 'Date:'),
    document.fonts.load('700 40px Poppins', 'Date:')
  ];
  INDIC_FAMILIES.forEach(function (f) { jobs.push(document.fonts.load('700 40px "' + f + '"', name)); });
  return Promise.all(jobs).then(function () { return document.fonts.ready; });
}

function wrapTwoLines(ctx, text, maxW) {
  var words = text.split(' ');
  if (words.length < 2) return null;
  var best = null;
  for (var i = 1; i < words.length; i++) {
    var a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    var w = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (!best || w < best.w) best = { lines: [a, b], w: w };
  }
  return best && best.w <= maxW ? best.lines : null;
}

/** Returns { size, lines } so the name never clips: shrink one line, then two lines, then shrink further. */
function fitName(ctx, name) {
  var N = CERT.NAME, size;
  function setFont(s) { ctx.font = '700 ' + s + 'px ' + NAME_STACK; }
  for (size = N.maxSize; size >= N.singleMin; size -= 2) {
    setFont(size);
    if (ctx.measureText(name).width <= N.maxW) return { size: size, lines: [name] };
  }
  for (size = N.twoLineMax; size >= N.twoLineMin; size -= 2) {
    setFont(size);
    var l = wrapTwoLines(ctx, name, N.maxW);
    if (l) return { size: size, lines: l };
  }
  for (size = N.twoLineMin; size >= N.absMin; size -= 1) {
    setFont(size);
    if (ctx.measureText(name).width <= N.maxW) return { size: size, lines: [name] };
  }
  setFont(N.absMin);
  return { size: N.absMin, lines: [name] };
}

function renderCertificate(name, dateStr) {
  return Promise.all([loadBg(), ensureFonts(name, dateStr)]).then(function (r) {
    var bg = r[0];
    var c = document.createElement('canvas');
    c.width = CERT.W * CERT.SCALE; c.height = CERT.H * CERT.SCALE;
    var ctx = c.getContext('2d');
    ctx.scale(CERT.SCALE, CERT.SCALE);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#FAF8F3'; ctx.fillRect(0, 0, CERT.W, CERT.H);   // opaque, no transparency
    ctx.drawImage(bg, 0, 0, CERT.W, CERT.H);

    ctx.fillStyle = CERT.COLOR; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var fit = fitName(ctx, name);
    ctx.font = '700 ' + fit.size + 'px ' + NAME_STACK;
    var N = CERT.NAME, lh = fit.size * N.lineGap;
    var y0 = N.cy - (fit.lines.length - 1) * lh / 2;
    fit.lines.forEach(function (ln, i) { ctx.fillText(ln, N.cx, y0 + i * lh); });

    // Date, beside the printed "Date:" label (label is part of the background).
    var D = CERT.DATE;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = '700 ' + D.size + 'px Poppins,system-ui,sans-serif';
    ctx.fillText(dateStr, D.x, D.y);

    return new Promise(function (resolve, reject) {
      c.toBlob(function (b) { b ? resolve(b) : reject(new Error('PNG export failed')); }, 'image/png');
    });
  });
}
window.__renderCertificate = renderCertificate;   // used by the test harness

/* =============================== Submit =============================== */
var currentBlob = null, currentUrl = null;

function setBusy(on) {
  busy = on;
  submitBtn.innerHTML = '';
  if (on) {
    var s = document.createElement('span'); s.className = 'spin';
    submitBtn.appendChild(s); submitBtn.appendChild(document.createTextNode('Creating your certificate…'));
    submitBtn.disabled = true;
  } else {
    submitBtn.textContent = 'Get Your Certificate'; updateButton();
  }
}

$('form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  if (busy) return;                                  // block duplicate submissions
  var name = cleanName(nameEl.value), n = normaliseMobile(phoneEl.value);
  if (!nameValid(name) || !n || verified !== n) { updateButton(); return; }

  setBusy(true); setMsg('', null);
  api({ action: 'generate', mobile: n, name: name }).then(function (res) {
    if (!res.ok) { throw res; }
    return renderCertificate(res.name || name, res.date).then(function (blob) { return { blob: blob }; });
  }).then(function (out) {
    showResult(out.blob);
    setBusy(false);
  }).catch(function (err) {
    setBusy(false);
    if (err && err.code === 'NOT_FOUND') { cache[n] = 'notfound'; verified = null; phoneWrap.classList.remove('ok'); setMsg('err', notFoundNode()); updateButton(); return; }
    var text = err && err.message ? err.message : 'We could not create your certificate. Please try again.';
    if (!(err && err.code)) text = 'We could not create your certificate image. Please try again.';
    setMsg('err', retryNode(text + ' ', function () { $('form').requestSubmit ? $('form').requestSubmit() : submitBtn.click(); }));
    updateButton();
  });
});

function showResult(blob) {
  if (currentUrl) URL.revokeObjectURL(currentUrl);
  currentBlob = blob; currentUrl = URL.createObjectURL(blob);
  $('certImg').src = currentUrl; $('lightImg').src = currentUrl;
  $('shareNote').hidden = true;
  document.body.classList.add('done');
  window.scrollTo(0, 0);
}

/* =============================== Share =============================== */
function downloadBlob() {
  var a = document.createElement('a');
  a.href = currentUrl; a.download = FILE_NAME; document.body.appendChild(a); a.click(); a.remove();
}

$('share').addEventListener('click', function () {
  if (!currentBlob) return;
  var file = new File([currentBlob], FILE_NAME, { type: 'image/png' });
  var note = $('shareNote');
  var canFiles = false;
  try { canFiles = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}

  if (canFiles) {
    navigator.share({ files: [file], text: SHARE_TEXT }).catch(function (e) {
      if (e && e.name === 'AbortError') return;            // user closed the share sheet
      fallbackShare(note);
    });
  } else {
    fallbackShare(note);
  }
});

function fallbackShare(note) {
  // Browsers without file sharing: save the PNG, then open WhatsApp with the message.
  // A WhatsApp link cannot attach a local image, so the person must attach it themselves.
  downloadBlob();
  note.hidden = false;
  note.innerHTML = '';
  var s = document.createElement('strong'); s.textContent = 'Your certificate was saved to this device. ';
  note.appendChild(s);
  note.appendChild(document.createTextNode('This browser can’t attach images to WhatsApp automatically. In WhatsApp, tap the attach (＋ / 📎) icon and choose the saved certificate image, then send.'));
  setTimeout(function () {
    window.open('https://wa.me/?text=' + encodeURIComponent(SHARE_TEXT), '_blank', 'noopener');
  }, 600);
}

/* =============================== Misc UI =============================== */
var lb = $('lightbox');
function openLb() { lb.classList.add('open'); }
function closeLb() { lb.classList.remove('open'); }
$('certImg').addEventListener('click', openLb);
$('certImg').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(); } });
lb.addEventListener('click', closeLb);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });

$('again').addEventListener('click', function () {
  document.body.classList.remove('done');
  nameEl.focus();
});

// Warm the heavy assets while the visitor types.
window.addEventListener('load', function () { loadBg().catch(function () {}); document.fonts.load('700 40px Poppins', 'A'); });
updateButton();
})();
</script>
</body>
</html>
